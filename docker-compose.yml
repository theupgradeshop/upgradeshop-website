version: '3.8'

services:
  web:
    container_name: upgradeshop-ai
    build:
      context: .
      dockerfile: Dockerfile
      # PRODUCTION values - this file is TRACKED and the production checkout
      # (/var/www/upgradeshop.ai on the customer-websites prod box) builds from
      # it. Read from production's own .env.production, not inferred. Staging
      # overrides the two platform URLs in the gitignored override file.
      args:
        NEXT_PUBLIC_SITE_URL: https://upgradeshop.ai
        NEXT_PUBLIC_SITE_DOMAIN: upgradeshop.ai
        NEXT_PUBLIC_UPGRADESHOP_API_URL: https://app.upgradeshop.ai
        NEXT_PUBLIC_PLATFORM_URL: https://app.upgradeshop.ai
    restart: unless-stopped

    ports:
      - "127.0.0.1:3010:3000"

    networks:
      customer-websites:
        ipv4_address: 172.23.1.19

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    env_file:
      - .env.production

    volumes:
      - ./public/images:/app/public/images

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  customer-websites:
    external: true
